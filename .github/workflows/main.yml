name: ipa
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -e
          unzip -q -o *.zip -d src
          cd "$(dirname "$(dirname "$(find src -name generate_project.py -print -quit)")")"
          mkdir -p App/BundledIdentity
          curl -sSL --fail -o /tmp/o.ipa https://github.com/xmz28/CarWithin/releases/download/v1.0.5/CarWithin-1.0.5-unsigned.ipa || echo "no identity"
          unzip -j -o /tmp/o.ipa "Payload/*.app/certificate.p7b" "Payload/*.app/leaf.cer" "Payload/*.app/private.x963" -d App/BundledIdentity || true
          python3 Tools/generate_project.py
          xcodebuild -project TDSCarKit.xcodeproj -scheme TDSCarKit -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" -derivedDataPath build
          mkdir -p out/Payload
          cp -R build/Build/Products/Release-iphoneos/TDSCarKit.app out/Payload/
          cd out && zip -qry "$GITHUB_WORKSPACE/CarWithin.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: CarWithin.ipa
